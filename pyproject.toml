[project]
name = "nutriguide"
version = "0.2.0"
description = "USDA-grounded RAG nutrition chat assistant"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "gradio>=5.4,<6",
    "sentence-transformers>=3.2",
    "faiss-cpu>=1.9",
    "transformers>=4.46,<5",
    "torch>=2.4",
    "accelerate>=1.0",
    "pdfplumber>=0.11",
]

[project.scripts]
nutriguide = "nutriguide.app:main"
nutriguide-build-index = "nutriguide.ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nutriguide"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64"]

[tool.pixi.dependencies]
python = ">=3.11,<3.14"

[tool.pixi.pypi-dependencies]
nutriguide = { path = ".", editable = true }

[tool.pixi.tasks]
app = "nutriguide"
build-index = "nutriguide-build-index"

[tool.pixi.feature.dev.pypi-dependencies]
pytest = ">=8"
ruff = ">=0.6"

[tool.pixi.feature.dev.tasks]
test = "pytest"
lint = "ruff check src tests"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
